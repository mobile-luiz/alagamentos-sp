# Configuração para hospedar no Render (render.com) com um clique em "New > Blueprint".
# A página e o servidor ficam juntos no mesmo endereço, com HTTPS.
services:
  - type: web
    name: alagamentos-sp
    runtime: node
    plan: free
    buildCommand: cd servidor && npm install
    startCommand: node servidor/server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: HISTORICO_DIAS
        value: "60"
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_EMAIL
        sync: false
